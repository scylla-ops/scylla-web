# Dependency updates, one pull request per group and per week, against the version branch.
# `target-branch` names the current version branch: move it when a new version branch opens.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: v0.6.1
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      # One pull request for the minor and patch updates of the runtime dependencies.
      runtime:
        dependency-type: production
        update-types: [minor, patch]
      # One for the toolchain (Vite, Vitest, ESLint, TypeScript, Lingui, ...).
      tooling:
        dependency-type: development
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose: two copies would split the query cache (see packages/core/src/query).
      - dependency-name: '@tanstack/query-core'
      # Alias of TypeScript 6 for the tools that have no TypeScript 7 API yet (see AGENTS.md).
      - dependency-name: typescript

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    target-branch: v0.6.1
    commit-message:
      prefix: chore
