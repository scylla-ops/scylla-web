name: Frontend

# Tests, lint, and a static job (typecheck, architecture boundaries, catalogs, build), in parallel.
# GitHub does not run a PR again when its base moves, so a push to a version branch checks the
# real tree after each merge.
on:
  push:
    branches: [main, 'v*.*.*']
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only humans author commits (CONTRIBUTING.md, "AI tools"): no agent as author,
  # committer or co-author. GitHub counts co-authors as contributors.
  authors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The first push of a new branch has no range. Its commits were checked in their PRs.
      - name: No AI agent in the commit authors
        if: github.event_name != 'push' || !github.event.created
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}..{1}', github.base_ref, github.event.pull_request.head.sha) || github.event_name == 'merge_group' && format('{0}..{1}', github.event.merge_group.base_sha, github.event.merge_group.head_sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: node scripts/check-commit-authors.mjs "$RANGE"

  # The suite runs in 6 shards. On a pull request, they only run the tests. Elsewhere, each shard
  # writes a blob report with its coverage; the `coverage` job merges them and applies the
  # thresholds of vite.config.ts.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup

      - name: Tests
        if: github.event_name == 'pull_request'
        run: pnpm exec vitest run --shard=${{ matrix.shard }}/6 --reporter=dot --reporter=github-actions

      # The thresholds apply to the merged report, not to a part of the suite.
      # A blob report alone does not name a failed test in the log.
      - name: Tests with coverage
        if: github.event_name != 'pull_request'
        run: >-
          pnpm exec vitest run --shard=${{ matrix.shard }}/6
          --reporter=dot --reporter=github-actions --reporter=blob --coverage
          --coverage.thresholds.statements=0 --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0 --coverage.thresholds.lines=0

      - uses: actions/upload-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: blob-report-${{ matrix.shard }}
          path: .vitest/blob
          retention-days: 1

  coverage:
    needs: test
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup
        with:
          generate: "false"

      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: .vitest/blob
          merge-multiple: true

      - name: Coverage thresholds
        run: pnpm exec vitest --merge-reports --coverage

  # No ESLint cache: a checkout sets new file times, so each file misses, and a cached result can
  # miss an error that a changed dependency causes.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup

      - name: Lint
        run: pnpm run lint

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup

      # Figma imports packages/ui/tokens/: the files must be the export of styles.css.
      - name: Design tokens
        run: pnpm run tokens:check

      - name: Typecheck
        run: pnpm run typecheck

      # Both are hard gates: the module graph is cycle-free and rule-clean, and
      # regressing it should fail the build.
      - name: Architecture boundaries
        run: pnpm run depcruise

      - name: Module cycles
        run: pnpm run depcruise:cycles

      # Extract first (tolerated failure, as in `prebuild`): the check reads the
      # .po files, so without this a string added to source but never extracted
      # would be invisible to it and the collision would land on main.
      - name: Catalog collisions
        run: (pnpm run extract || true) && pnpm run i18n:collisions

      # Not `pnpm run build`: the steps above have run typecheck and extract, and the
      # set-up has run gen-proto. Compile again, because extract can change the .po files.
      - name: Build
        run: pnpm run compile && pnpm exec vite build

  # The required check of the version branch. A job that needs a failed job is skipped, and a
  # skipped check can pass, so this job always runs and reads the results. A new job goes in `needs`.
  ci-ok:
    if: always()
    needs: [authors, test, coverage, lint, static]
    runs-on: ubuntu-latest
    steps:
      - name: All jobs passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          ! echo "$RESULTS" | grep -qE 'failure|cancelled'
