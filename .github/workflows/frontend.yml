name: Frontend

# Tests, lint, and a static job (typecheck, architecture boundaries, catalogs, build), in parallel.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Only humans author commits (CONTRIBUTING.md, "AI tools"): no agent as author,
  # committer or co-author. GitHub counts co-authors as contributors.
  authors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: No AI agent in the commit authors
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('origin/{0}..{1}', github.base_ref, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: node scripts/check-commit-authors.mjs "$RANGE"

  # The suite runs in 3 shards. Each shard writes a blob report with its coverage; the
  # `coverage` job merges them and applies the thresholds of vite.config.ts.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup

      # The thresholds apply to the merged report, not to a third of the suite.
      - name: Tests
        run: >-
          pnpm exec vitest run --shard=${{ matrix.shard }}/3 --reporter=blob --coverage
          --coverage.thresholds.statements=0 --coverage.thresholds.branches=0
          --coverage.thresholds.functions=0 --coverage.thresholds.lines=0

      - uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: .vitest/blob
          retention-days: 1

  coverage:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup
        with:
          generate: "false"

      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: .vitest/blob
          merge-multiple: true

      - name: Coverage thresholds
        run: pnpm exec vitest --merge-reports --coverage

  # Typed lint is the slowest check. On a pull request, ESLint reuses its cache of the same
  # branch. On a push, it runs in full: a cache can miss an error that a changed dependency causes.
  lint:
    runs-on: ubuntu-latest
    env:
      ESLINT_CACHE_PATH: node_modules/.cache/eslint
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup

      - name: Restore the ESLint cache
        if: github.event_name == 'pull_request'
        uses: actions/cache@v4
        with:
          path: ${{ env.ESLINT_CACHE_PATH }}
          key: eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', 'tooling/eslint.js') }}-${{ github.head_ref }}-${{ github.run_id }}
          restore-keys: |
            eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', 'tooling/eslint.js') }}-${{ github.head_ref }}-
            eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.js', 'tooling/eslint.js') }}-${{ github.base_ref }}-

      - name: Lint (cached)
        if: github.event_name == 'pull_request'
        run: pnpm run lint --cache --cache-location ${{ env.ESLINT_CACHE_PATH }}/

      - name: Lint
        if: github.event_name != 'pull_request'
        run: pnpm run lint

  static:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ./.github/actions/setup

      - name: Typecheck
        run: pnpm run typecheck

      # Both are hard gates: the module graph is cycle-free and rule-clean, and
      # regressing it should fail the build.
      - name: Architecture boundaries
        run: pnpm run depcruise

      - name: Module cycles
        run: pnpm run depcruise:cycles

      # Extract first (tolerated failure, as in `prebuild`): the check reads the
      # .po files, so without this a string added to source but never extracted
      # would be invisible to it and the collision would land on main.
      - name: Catalog collisions
        run: (pnpm run extract || true) && pnpm run i18n:collisions

      - name: Build
        run: pnpm run build
