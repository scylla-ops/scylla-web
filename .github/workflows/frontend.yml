name: Frontend

# Typecheck, tests, lint, architecture boundaries and build.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch supersedes an in-flight run.
concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Same reasoning as scripts/gen-proto.mjs: give @protobuf-ts/protoc a
      # system protoc so it never reaches out to GitHub mid-build. protobuf-dev
      # ships the well-known types (google/protobuf/timestamp.proto) under
      # /usr/include, which protoc resolves automatically.
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # src/generated is gitignored, so nothing below can run without this.
      - name: Generate proto clients
        run: pnpm run gen-proto

      - name: Compile locale catalogs
        run: pnpm run compile

      - name: Typecheck
        run: pnpm run typecheck

      # The Vitest suite imports the generated gRPC clients through the mappers,
      # so it has to run after `gen-proto` like everything else below.
      - name: Tests
        run: pnpm run coverage

      - name: Lint
        run: pnpm run lint

      # Both are hard gates: the module graph is cycle-free and rule-clean, and
      # regressing it should fail the build.
      - name: Architecture boundaries
        run: pnpm run depcruise

      - name: Module cycles
        run: pnpm run depcruise:cycles

      # Extract first (tolerated failure, as in `prebuild`): the check reads the
      # .po files, so without this a string added to source but never extracted
      # would be invisible to it and the collision would land on main.
      - name: Catalog collisions
        run: (pnpm run extract || true) && pnpm run i18n:collisions

      - name: Build
        run: pnpm run build
