// A subset of googleapis google/rpc/error_details.proto, with the same field numbers.
syntax = "proto3";

package google.rpc;

// The reason of a refusal, with its facts.
message ErrorInfo {
  // A stable code, for example LAST_OWNER.
  string reason = 1;
  // The domain of the reason: scylla.
  string domain = 2;
  // The facts of the refusal, for example used and limit.
  map<string, string> metadata = 3;
}

// The fields of a request that are not valid.
message BadRequest {
  // A field that is not valid.
  message FieldViolation {
    // The path of the field, for example nodes[2].env[0].name.
    string field = 1;
    // Why the value is not valid, in English.
    string description = 2;
  }

  // The fields that are not valid.
  repeated FieldViolation field_violations = 1;
}
